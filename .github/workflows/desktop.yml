name: Instaladores de escritorio

# Se corre a mano desde la pestaña Actions. La dirección del servidor se toma de la variable
# de repositorio MISVENTAS_API_URL (Settings → Secrets and variables → Actions → Variables).
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Armar instaladores
        run: npm run build -w @misventas/desktop
        env:
          VITE_API_URL: ${{ vars.MISVENTAS_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: mis-ventas-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.dmg
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
